services:
  libretranslate:
    container_name: libretranslate
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: libretranslate-fluently:local
    ports:
      - "5000:5000"
    restart: unless-stopped
    environment:
      LT_SETTINGS_ADMIN_TOKEN: ${LT_SETTINGS_ADMIN_TOKEN:?Set LT_SETTINGS_ADMIN_TOKEN in .env}
      LT_GUI_SETTINGS_PATH: /app/db/gui_settings.json
      # Allow remote private-network model servers only when trusted.
      LT_AI_ALLOW_PRIVATE_NETWORK: ${LT_AI_ALLOW_PRIVATE_NETWORK:-false}
    volumes:
      - fluently_data:/app/db
      - fluently_models:/home/libretranslate/.local
    healthcheck:
      test: ['CMD-SHELL', './venv/bin/python scripts/healthcheck.py']
      interval: 10s
      timeout: 4s
      retries: 4
      start_period: 5s
    ## Uncomment this for logging in docker compose logs
    # tty: true
    ## Uncomment above command and define your args if necessary
    ## Refer to the documentation for more information: https://docs.libretranslate.com/guides/installation/#arguments
    # command: --ssl --req-limit 100 --char-limit 500
    ## Uncomment this section and the libretranslate_api_keys volume if you want to backup your API keys
    # environment:
    #   - LT_API_KEYS=true
    #   - LT_API_KEYS_DB_PATH=/app/db/api_keys.db # Same result as `db/api_keys.db` or `./db/api_keys.db`
    ## Uncomment these vars and libretranslate_models volume to optimize loading time.
    #   - LT_UPDATE_MODELS=true
    #   - LT_LOAD_ONLY=en,fr
    # volumes:
    #   - libretranslate_api_keys:/app/db
    # Keep the models in a docker volume, to avoid re-downloading on startup
    #   - libretranslate_models:/home/libretranslate/.local:rw

# volumes:
#   libretranslate_api_keys:
#   libretranslate_models:

volumes:
  fluently_data:
  fluently_models:
