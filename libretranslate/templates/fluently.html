<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluently · 多版本翻译对照</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/fluently.css', v='3') }}">
</head>
<body>
<div class="workspace-shell">
  <header class="workspace-header glass">
    <a href="{{ url_for('fluently.workspace') }}" class="brand">
      <span class="brand-icon">文</span> Fluently
    </a>
    <nav aria-label="导航">
      <a href="/">LibreTranslate</a>
      <a href="{{ url_for('fluently.settings_page') }}" class="nav-pill">⚙ 设置中心</a>
    </nav>
  </header>
  <main class="workspace-main compare-workspace">
    <div class="notice hidden" id="notice" role="status" aria-live="polite"></div>
    <section class="workspace-controls glass" aria-label="翻译选项">
      <div class="translate-toolbar">
        <label class="toolbar-field">原文语言
          <select id="source" aria-label="原文语言"><option value="auto">自动检测</option></select>
        </label>
        <button id="swap-language" class="swap-language" title="交换原文和目标语言" aria-label="交换语言">⇄</button>
        <label class="toolbar-field">目标语言
          <select id="target" aria-label="目标语言"></select>
        </label>
        <label class="toolbar-field engine-field">翻译引擎
          <select id="engine" aria-label="翻译引擎"></select>
        </label>
        <div class="toolbar-buttons">
          <button id="add-version" type="button" class="add-version">＋ 添加版本</button>
          <button id="translate" type="button" class="primary">翻译并对照</button>
        </div>
      </div>
    </section>
    <section class="versions-heading">
      <div>
        <h1>英文版本对照</h1>
        <p>每个卡片输入一个不同的英文版本，统一使用同一个引擎翻译，再比较表达与逻辑。</p>
      </div>
      <span id="version-count" class="version-count">2 个版本</span>
    </section>
    <section id="versions" class="versions-grid" aria-label="多版本原文与译文"></section>
    <div class="workspace-footer">
      <span>划选原文或译文即可弹出翻译卡片；AI 上下文解析在卡片下方显示。</span>
      <button id="add-version-bottom" type="button" class="add-version">＋ 添加对照版本</button>
    </div>
  </main>
</div>

<aside class="selection-popup glass hidden" id="selection-popup" role="dialog" aria-label="划词翻译与上下文解析" aria-live="polite">
  <div class="selection-popup-head">
    <span class="selection-mark">✦</span><strong>划词翻译</strong>
    <button id="close-selection" type="button" aria-label="关闭划词卡片">✕</button>
  </div>
  <div id="selection-original" class="selection-original"></div>
  <div id="selection-translation" class="selection-result">正在翻译…</div>
  <section id="selection-ai-section" class="selection-ai-section hidden">
    <div class="selection-ai-head">AI 上下文解析 <span>结合当前版本全文</span></div>
    <div id="selection-analysis" class="selection-analysis"></div>
  </section>
</aside>
<script src="{{ url_for('static', filename='js/fluently.js', v='3') }}"></script>
</body>
</html>
