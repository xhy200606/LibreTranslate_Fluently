<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluently · 智能翻译工作台</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/fluently.css') }}"></head>
<body>
<div class="workspace-shell">
<header class="workspace-header glass">
  <a href="{{ url_for('fluently.workspace') }}" class="brand"><span class="brand-icon">文</span> Fluently</a>
  <nav><a href="/">LibreTranslate</a><a href="{{ url_for('fluently.settings_page') }}" class="nav-pill">⚙ 设置中心</a></nav>
</header>
<main class="workspace-main">
  <div class="workspace-heading"><div class="eyebrow">INTELLIGENT TRANSLATION</div><h1>让每一种表达，都值得比较。</h1><p>多个翻译引擎并排对照。选中原文，了解每个词语背后的语境。</p></div>
  <div id="notice" role="status" class="notice hidden"></div>
  <section class="workspace-controls glass">
    <div class="language-picker"><label>原文语言 <select id="source"><option value="auto">自动检测</option></select></label><span class="switch-symbol">⇄</span><label>目标语言 <select id="target"></select></label></div>
    <div class="controls-right"><label>管理员令牌（调用 AI）<input type="password" autocomplete="off" id="token" placeholder="会话内有效"></label><button id="translate" class="primary">翻译并对比</button></div>
  </section>
  <section class="glass engine-choices"><div class="card-heading"><h2>对照引擎</h2><span class="card-info">选择独立免费协议、智能免费池或 AI 模型</span></div><div class="engine-select-grid" id="engine-choices"></div></section>
  <div class="grid-compare">
    <section class="glass translation-card original-card">
      <div class="card-heading"><span class="label-dot"></span><h2>原文</h2><span class="card-info" id="count">0 字符</span></div>
      <textarea id="original" placeholder="粘贴或输入需要翻译的内容。支持段落、逐句高亮和选词 AI 讲解。" spellcheck="false"></textarea>
      <div class="card-footer"><span>选择文字，可使用 AI 深度讲解</span><button id="clear">清空</button></div>
    </section>
    <section class="results-panel" id="results" aria-label="翻译对比结果"></section>
  </div>
  <section id="alignment" class="glass alignment-card hidden">
    <div class="card-heading"><h2>逐句对照</h2><span class="card-info">原文与译文按动态规划匹配；AI 语义对齐为可选模式，低置信度需要人工核对</span></div>
    <div class="alignment-grid" id="alignment-grid"></div>
  </section>
  <section id="explanation" class="glass explanation-card hidden">
    <div class="card-heading"><h2>✦ AI 深度讲解</h2><button id="close-explanation">关闭</button></div>
    <p id="selected-text"></p><div id="explanation-output"></div>
  </section>
</main>
</div>
<script src="{{ url_for('static', filename='js/fluently.js') }}"></script>
</body></html>
