<!doctype html>
<html lang="zh-CN" data-theme="{{ initial_theme }}">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f7fc">
<title>Fluently · 多版本翻译对照</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static',filename='brand/fluently-logo.svg') }}">
<link rel="stylesheet" href="{{ url_for('static',filename='css/fluently.css',v='7') }}">
</head>
<body>
<div class="workspace-shell">
  <header class="workspace-header glass">
    <a href="{{ url_for('fluently.workspace') }}" class="brand">
      <img class="brand-logo" src="{{ url_for('static',filename='brand/fluently-logo.svg') }}" width="36" height="36" alt="">
      <span>Fluently</span>
    </a>
    <nav aria-label="导航">
      <a href="/">LibreTranslate</a>
      <a href="{{ url_for('fluently.settings_page') }}" class="nav-pill">⚙ 设置</a>
    </nav>
  </header>
  <main class="workspace-main compare-workspace">
    <section class="workspace-controls glass" aria-label="翻译选项">
      <div class="translate-toolbar">
        <label class="toolbar-field">原文语言
          <select id="source" aria-label="原文语言"><option value="auto">自动检测</option></select>
        </label>
        <button id="swap-language" class="swap-language" title="交换原文和目标语言" aria-label="交换语言">⇄</button>
        <label class="toolbar-field">目标语言
          <select id="target" aria-label="目标语言"></select>
        </label>
        <label class="toolbar-field engine-field">翻译引擎
          <select id="engine" aria-label="翻译引擎"></select>
        </label>
        <div class="toolbar-buttons">
          <span id="version-count" class="version-count">2 个版本</span>
          <button id="add-version" type="button" class="add-version">＋ 添加版本</button>
          <button id="translate" type="button" class="primary">翻译并对照</button>
        </div>
      </div>
    </section>
    <section id="versions" class="versions-grid" aria-label="多版本原文与译文"></section>
    <div class="workspace-footer">
      <span>选中词语或句子即可查看释义与语法。</span>
      <button id="add-version-bottom" type="button" class="add-version">＋ 添加版本</button>
    </div>
  </main>
</div>

<div class="toast-viewport" aria-live="polite" aria-atomic="true">
  <div id="notice" class="fluently-toast hidden" role="status"></div>
</div>

<aside class="selection-popup glass hidden" id="selection-popup" role="dialog" aria-label="划词翻译与上下文解析" aria-live="polite">
  <header class="selection-popup-head">
    <div class="selection-title"><img src="{{ url_for('static',filename='brand/fluently-logo.svg') }}" alt="" width="24" height="24"><strong>划词翻译</strong></div>
    <button id="close-selection" type="button" aria-label="关闭卡片">×</button>
  </header>
  <nav class="selection-tabs" aria-label="划词模式">
    <button class="active" type="button" data-selection-mode="word">单词</button>
    <button type="button" data-selection-mode="sentence">句子</button>
  </nav>
  <div id="selection-original" class="selection-original"></div>
  <div id="selection-translation" class="selection-result">正在翻译…</div>
  <section id="dictionary-details" class="dictionary-details hidden" aria-label="词典资料">
    <div class="dictionary-meta">
      <span id="dictionary-pos" class="dictionary-pos"></span>
      <span id="dictionary-phonetic" class="dictionary-phonetic"></span>
      <span id="dictionary-source" class="dictionary-source"></span>
    </div>
    <p id="dictionary-definition" class="dictionary-definition"></p>
    <p id="dictionary-example" class="dictionary-example"></p>
  </section>
  <section id="selection-ai-section" class="selection-ai-section hidden" aria-label="AI 阅读讲解">
    <div class="selection-ai-head">AI 深入讲解 <span id="reading-provider-label"></span></div>
    <div class="reading-actions" role="group" aria-label="讲解模式">
      <button data-reading-action="meaning" type="button">大意</button>
      <button data-reading-action="grammar" type="button">句法</button>
      <button data-reading-action="usage" type="button">用法</button>
      <button data-reading-action="practice" type="button">练习</button>
    </div>
    <div id="analysis-structure" class="analysis-structure hidden" aria-label="句法结构"></div>
    <div id="analysis-detail" class="analysis-detail hidden"></div>
    <div id="selection-analysis" class="selection-analysis"></div>
  </section>
</aside>
<script src="{{ url_for('static',filename='js/fluently.js',v='7') }}"></script>
</body>
</html>
